# 构建单一产物并发布到 GitHub Pages
#
# 一个仓库只能发布 1 个 Pages 站点，因此这里把两部分合并进同一个产物：
#   博客  WebBlog/  (Astro 构建产物)  -> https://shilong.js.org/
#   导航  WebSite/                    -> https://shilong.js.org/aa/
#
# 2026-09-18：博客已由 docsify 切换为 Astro，并接管根路径。
#   `docs/` 目录仍然保留在仓库里 —— 它现在是博客的**内容源**
#   （WebBlog/src/content.config.ts 指向 ../docs/blog），但不再参与发布。
#   好处是产物从约 247 MB 降到约 2 MB，部署时间大幅缩短，
#   同时原始 Markdown 与第三方资料不再被公开托管。
#
# 使用前必须在仓库 Settings -> Pages -> Build and deployment -> Source
# 选择 "GitHub Actions"，否则 deploy-pages 会报 Get Pages site failed。

name: Deploy sites to GitHub Pages

on:
  push:
    branches: ["master"]
    # 只更新素材库时不必重新部署
    paths-ignore:
      - "CodeKey/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: WebBlog/package-lock.json

      - name: Build new blog (Astro)
        working-directory: WebBlog
        run: |
          npm ci
          npm run build
          # 产物结构自检：这几个文件缺失说明内容集合没读到文章
          for f in index.html rss.xml sitemap-index.xml search-index.json favicon.ico; do
            test -f "dist/$f" || { echo "缺少 dist/$f"; exit 1; }
          done
          echo "文章页数：$(find dist -name index.html | wc -l)"

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # 博客：Astro 产物直接放到站点根目录
          cp -r WebBlog/dist/. _site/

          # 导航站：WebSite/ 的内容放到子路径 aa/
          mkdir -p _site/aa
          cp -r WebSite/. _site/aa/
          rm -rf _site/aa/.workbuddy
          rm -f _site/aa/README.md

          # 自定义域名必须位于产物根目录，否则每次部署都会被重置
          echo "shilong.js.org" > _site/CNAME
          # 关闭 Jekyll（本产物已是纯静态，不需要它再做一次处理）
          touch _site/.nojekyll

          echo "---- artifact preview ----"
          ls -la _site
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
